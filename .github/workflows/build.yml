name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows .exe with PyInstaller
        shell: cmd
        run: |
          for /f "delims=" %%i in ('python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))"') do set CTK_PATH=%%i
          pyinstaller --onefile --name scrcpy_update --add-data "%CTK_PATH%;customtkinter" --add-data ".env.example;.env" --hidden-import "PIL._tkinter_finder" --hidden-import "customtkinter" --collect-all "customtkinter" --distpath dist main.py

      - name: Read VERSION
        id: get_version
        shell: bash
        run: |
          ver=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION=$ver" >> $GITHUB_ENV

      - name: Upload Windows Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/scrcpy_update.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
